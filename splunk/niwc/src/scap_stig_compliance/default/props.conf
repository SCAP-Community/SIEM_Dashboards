# Search-time extraction for dashboard app. Parsing/time configuration must be
# deployed on the applicable ingestion tier when forwarding JSONL files.
[scap:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "epoch_time"\s*:\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 15
TRUNCATE = 999999
KV_MODE = json

# SCC vNext sends target_host. Legacy SCC 5.16 RC1 emits a JSON "host".
# The explicit raw-json fallback avoids using Splunk's native metadata host.
EVAL-target_host = coalesce(json_extract(_raw, "target_host"), json_extract(_raw, "assessed_host"), json_extract(_raw, "host"))
