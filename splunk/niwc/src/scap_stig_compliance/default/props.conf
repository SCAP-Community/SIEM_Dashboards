# Search-time JSON extraction for the SCAP/STIG dashboard.
# For forwarded JSONL, event breaking/timestamp settings must be applied to
# the actual ingestion/parsing tier as well; search-head props alone cannot
# configure a forwarder or the receiving indexer.
[scap:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "epoch_time"\s*:\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 15
TRUNCATE = 999999
KV_MODE = json

# Normalized, producer-neutral assessed endpoint identifier. Never rely on
# Splunk's native indexed host field to identify the assessed endpoint.
# Backward compatible with 0.2.0 target_host, assessed_host and SCC payload host.
EVAL-host_name = coalesce(json_extract(_raw, "host_name"), json_extract(_raw, "target_host"), json_extract(_raw, "assessed_host"), json_extract(_raw, "host"))

# Scanner software identification is separate from schema_version and
# benchmark_version. Older SCC summaries used scc_version; older rule_result
# events without scc_version cannot recover the missing version information.
EVAL-scanner_name = coalesce(json_extract(_raw, "scanner_name"), if(isnotnull(json_extract(_raw, "scc_version")), "SCC", null()))
EVAL-scanner_version = coalesce(json_extract(_raw, "scanner_version"), json_extract(_raw, "scc_version"))
